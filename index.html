<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interview trainer for evaluating AI vulnerability-triage agents: static vs guided evals, pass criteria, unresolved findings. Comic guides, games, quizzes, charts and flows.">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Triage Eval Dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky XP header, a scrolling module chip row, one module at a time in a 960px column.
   Each module opens with a comic strip, then prose, charts, a game and a quiz in bordered cards. */
:root{
  --bg:#f1f4f8; --surface:#ffffff; --surface-2:#e7ecf2; --fg:#15202b; --muted:#56637a; --line:#d3dae4;
  --accent:#0e7c86; --accent-ink:#ffffff; --accent-soft:#d3eff1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#9085e9;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --font-display:'Baloo 2','Segoe UI',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a; --surface:#182028; --surface-2:#212b36; --fg:#eef2f6; --muted:#a3adba; --line:#2d3845;
    --accent:#3fc1cb; --accent-ink:#06282b; --accent-soft:#143538;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9;
    --grid:#2c2c2a; --axis:#383835; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#182028; --surface-2:#212b36; --fg:#eef2f6; --muted:#a3adba; --line:#2d3845;
  --accent:#3fc1cb; --accent-ink:#06282b; --accent-soft:#143538;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9;
  --grid:#2c2c2a; --axis:#383835; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{width:30px;height:30px}
.xp{flex:1;min-width:180px;display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.xp .bar{flex:1;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.xp .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.xp b{color:var(--fg)}
.nav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:700 .82rem var(--font-body);cursor:pointer;display:flex;gap:7px;align-items:center}
.chip[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.chip.done .dot{background:var(--good)}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:8px 56px}
h1{font-family:var(--font-display);font-size:clamp(1.9rem,4vw,2.7rem);line-height:1.08;margin:.3em 0 .2em;text-wrap:balance}
h2{font-family:var(--font-display);font-size:1.5rem;line-height:1.2;margin:1.6em 0 .4em;text-wrap:balance}
h3{font-family:var(--font-display);font-size:1.12rem;margin:1.1em 0 .3em}
p,li{max-width:70ch}
ul,ol{padding-left:1.3em}
li{margin:.25em 0}
.lead{font-size:1.08rem}
.eyebrow{font:700 .72rem var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.small{font-size:.85rem;color:var(--muted)}
code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
.card.game{border:2px solid var(--accent)}
.card.note{background:var(--accent-soft);border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:10px 0 6px}
.hero .cast{display:flex;gap:6px;flex-wrap:wrap}
.hero .cast svg{width:64px;height:64px}
.comic{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:14px 0 6px}
.panel{border:2.5px solid var(--fg);border-radius:10px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:4px 4px 0 var(--fg)}
.panel .who{display:flex;align-items:center;gap:8px;font:700 .78rem var(--font-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.panel .who svg{width:50px;height:50px;flex:0 0 auto}
.bubble{position:relative;background:var(--surface-2);border-radius:12px;padding:10px 12px;font:500 1rem/1.35 var(--font-display)}
.bubble::before{content:"";position:absolute;top:-9px;left:20px;border:9px solid transparent;border-bottom-color:var(--surface-2);border-top:0}
.btn{font:700 .92rem var(--font-body);border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.fc:focus-visible,.sent:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:400 .95rem/1.4 var(--font-body);cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,var(--surface))}
.opt[disabled]{cursor:default}
.fb p{margin:10px 0}
.fb .ok b{color:var(--good)} .fb .no b{color:var(--crit)}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.qtext{font:700 1.05rem/1.4 var(--font-body);margin:8px 0}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 .72rem var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
figure{margin:12px 0}
figure svg{width:100%;height:auto;display:block;font-family:var(--font-body)}
figcaption{font-size:.85rem;color:var(--muted);margin-top:6px;max-width:70ch}
details.tv{font-size:.85rem;margin-top:6px} details.tv summary{cursor:pointer;color:var(--muted)}
details.tv table{min-width:0}
.ink{fill:var(--fg)} .mut{fill:var(--muted)} .grid{stroke:var(--grid)} .axis{stroke:var(--axis)} .gate{stroke:var(--crit)}
.s1{fill:var(--s1)} .s2{fill:var(--s2)} .s3{fill:var(--s3)}
.ls1{stroke:var(--s1);fill:none} .ls2{stroke:var(--s2);fill:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dg{color:var(--fg)} .dg text{font-size:12px;fill:currentColor}
.dg .lbl{font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.dg .box{fill:var(--surface);stroke:currentColor;stroke-width:1.5}
.dg .acc{fill:var(--accent-soft);stroke:var(--accent)}
.dg .dec{stroke-dasharray:5 4}
.dg .bad{stroke:var(--crit)}
.dg .zone{fill:none;stroke:var(--muted);stroke-dasharray:6 5}
.dg .ztxt{font-size:11px;fill:var(--muted);letter-spacing:.08em}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--fg);color:var(--bg);font:600 .8rem var(--font-body);padding:6px 9px;border-radius:8px;max-width:260px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--accent);color:var(--accent-ink);font:700 .9rem var(--font-display);padding:9px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font:700 .76rem var(--font-body);background:var(--surface-2);color:var(--muted)}
.badge.on{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font:700 .74rem var(--font-body);letter-spacing:.04em}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--good)}
.pill.no{background:color-mix(in srgb,var(--crit) 18%,var(--surface));color:var(--crit)}
.pill.t{background:var(--surface-2);color:var(--muted)}
.modcard{display:flex;gap:12px;align-items:flex-start}
.modcard svg{width:44px;height:44px;flex:0 0 auto}
.modcard h3{margin:0 0 2px}
.modcard .btn{margin-top:6px}
.ladder{display:grid;gap:6px}
.ladder div{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ladder b{font-family:var(--font-mono);color:var(--accent)}
.sent{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1.5px dashed var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:400 .92rem/1.45 var(--font-mono);cursor:pointer;white-space:pre-wrap;word-break:break-word}
.sent.right{border-style:solid;border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.sent.wrong{border-style:solid;border-color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,var(--surface))}
.fcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.fc{min-height:110px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);padding:12px;text-align:left;cursor:pointer;font:400 .88rem/1.4 var(--font-body)}
.fc .term{font:700 1rem var(--font-display);display:block}
.fc.flip{background:var(--accent-soft);border-color:var(--accent)}
.lab{display:grid;grid-template-columns:1fr;gap:10px}
.lab .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stat .v{font:800 1.3rem var(--font-display);font-variant-numeric:tabular-nums}
.stat .k{font-size:.74rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=number]{width:72px;font:inherit;padding:4px 6px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.kgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 10px;align-items:center;max-width:380px;font-size:.9rem}
.kgrid .h{font:700 .72rem var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}
.minient svg{width:28px;height:28px;vertical-align:middle;margin-right:4px}
.center{text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="top">
  <div class="brand" id="brand"></div>
  <div class="xp"><span id="lvl"><b>Trainee</b></span><div class="bar"><i id="xpbar"></i></div><span id="xpnum">0 XP</span></div>
</div>
<nav class="nav" id="nav" aria-label="Modules"></nav>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>
<div class="tip" id="tip" hidden></div>
<script>
/* ---------- state ---------- */
const KEY='triage-eval-dojo.v1';
const S={xp:0,done:{},quiz:{},rate:{},mod:'start',games:{}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);Object.assign(S,o)}}catch(e){}}
const LEVELS=[[0,'Trainee'],[120,'Analyst'],[320,'Senior'],[620,'Staff'],[1000,'Principal']];
function level(xp){let l=LEVELS[0],next=null;for(let i=0;i<LEVELS.length;i++){if(xp>=LEVELS[i][0]){l=LEVELS[i];next=LEVELS[i+1]||null}}return{name:l[1],from:l[0],next}}
function hud(){const L=level(S.xp);document.getElementById('lvl').innerHTML='<b>'+L.name+'</b>'+(L.next?' · next: '+L.next[1]+' at '+L.next[0]:' · max');document.getElementById('xpnum').textContent=S.xp+' XP';const pct=L.next?Math.round(100*(S.xp-L.from)/(L.next[0]-L.from)):100;document.getElementById('xpbar').style.width=pct+'%'}
let toastT=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2200)}
function award(key,n,msg){if(S.done[key])return false;S.done[key]=true;S.xp+=n;save();hud();toast('+'+n+' XP · '+msg);return true}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* ---------- tooltip ---------- */
(function(){const tip=document.getElementById('tip');let cur=null;
function move(e){tip.style.left=Math.min(window.innerWidth-270,e.clientX+12)+'px';tip.style.top=(e.clientY+14)+'px'}
document.addEventListener('pointerover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t)return;cur=t;tip.textContent=t.getAttribute('data-tip');tip.hidden=false;move(e)});
document.addEventListener('pointermove',e=>{if(cur)move(e)});
document.addEventListener('pointerout',e=>{if(cur&&!cur.contains(e.relatedTarget)){cur=null;tip.hidden=true}});
})();

/* ---------- entities ---------- */
const INK='#1d2430';
const ENT={
 pip:{name:'Pip',role:'static eval · ground truth',color:'#2a78d6'},
 rue:{name:'Rue',role:'guided eval · red team',color:'#eb6834'},
 qbit:{name:'Qbit',role:'the unresolved queue',color:'#9085e9'},
 gate:{name:'Gate',role:'release decision',color:'#1baf7a'}
};
function ent(id,size){size=size||64;const sw='stroke="'+INK+'" stroke-width="2" stroke-linejoin="round"';let b='';
 if(id==='pip'){b='<path d="M14 22 L18 6 L27 19 Z" fill="#2a78d6" '+sw+'/><path d="M50 22 L46 6 L37 19 Z" fill="#2a78d6" '+sw+'/>'+
  '<ellipse cx="32" cy="37" rx="22" ry="23" fill="#2a78d6" '+sw+'/><ellipse cx="32" cy="46" rx="12" ry="11" fill="#9ec5f4"/>'+
  '<circle cx="23" cy="30" r="8" fill="#fff" stroke="'+INK+'" stroke-width="2.5"/><circle cx="41" cy="30" r="8" fill="#fff" stroke="'+INK+'" stroke-width="2.5"/>'+
  '<line x1="31" y1="30" x2="33" y2="30" stroke="'+INK+'" stroke-width="2.5"/><circle cx="24" cy="31" r="3" fill="'+INK+'"/><circle cx="42" cy="31" r="3" fill="'+INK+'"/>'+
  '<circle cx="25.2" cy="29.8" r="1" fill="#fff"/><circle cx="43.2" cy="29.8" r="1" fill="#fff"/>'+
  '<path d="M29 39 L35 39 L32 44 Z" fill="#eda100" stroke="'+INK+'" stroke-width="1.5" stroke-linejoin="round"/>'}
 if(id==='rue'){b='<path d="M10 24 L17 4 L28 17 Z" fill="#eb6834" '+sw+'/><path d="M54 24 L47 4 L36 17 Z" fill="#eb6834" '+sw+'/>'+
  '<path d="M10 27 Q10 56 32 58 Q54 56 54 27 Q44 14 32 14 Q20 14 10 27 Z" fill="#eb6834" '+sw+'/>'+
  '<ellipse cx="32" cy="46" rx="11" ry="9" fill="#ffe3d1"/><circle cx="23" cy="33" r="3.5" fill="'+INK+'"/><circle cx="41" cy="33" r="3.5" fill="'+INK+'"/>'+
  '<circle cx="24.3" cy="31.8" r="1.2" fill="#fff"/><circle cx="42.3" cy="31.8" r="1.2" fill="#fff"/><ellipse cx="32" cy="43" rx="3" ry="2" fill="'+INK+'"/>'+
  '<circle cx="49" cy="49" r="7" fill="#cfe9ff" fill-opacity=".8" stroke="'+INK+'" stroke-width="2.5"/><line x1="54" y1="54" x2="61" y2="61" stroke="'+INK+'" stroke-width="3.5" stroke-linecap="round"/>'}
 if(id==='qbit'){b='<path d="M12 34 a20 20 0 0 1 40 0 v14 q-4 4 -8 0 q-4 4 -8 0 q-4 4 -8 0 q-4 4 -8 0 q-4 4 -8 0 Z" fill="#9085e9" '+sw+'/>'+
  '<circle cx="24" cy="34" r="3.2" fill="'+INK+'"/><circle cx="40" cy="34" r="3.2" fill="'+INK+'"/><circle cx="25.2" cy="32.8" r="1.1" fill="#fff"/><circle cx="41.2" cy="32.8" r="1.1" fill="#fff"/>'+
  '<path d="M26 41 q6 4 12 0" stroke="'+INK+'" stroke-width="2" fill="none" stroke-linecap="round"/>'+
  '<text x="32" y="26" text-anchor="middle" font-size="15" font-weight="800" font-family="Baloo 2,sans-serif" fill="#fff">?</text>'}
 if(id==='gate'){b='<line x1="32" y1="5" x2="32" y2="12" stroke="'+INK+'" stroke-width="2"/><circle cx="32" cy="5" r="2.6" fill="#1baf7a" stroke="'+INK+'" stroke-width="1.5"/>'+
  '<path d="M12 16 L32 10 L52 16 V34 Q52 52 32 60 Q12 52 12 34 Z" fill="#1baf7a" '+sw+'/>'+
  '<rect x="19" y="22" width="26" height="14" rx="5" fill="#0f2a22"/><circle cx="27" cy="29" r="3" fill="#8ff7c9"/><circle cx="37" cy="29" r="3" fill="#8ff7c9"/>'+
  '<path d="M24 45 L30 50 L41 41" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'}
 return '<svg viewBox="0 0 64 64" width="'+size+'" height="'+size+'" aria-hidden="true">'+b+'</svg>'}
function panel(who,text){const e=ENT[who];return '<div class="panel"><div class="who">'+ent(who)+'<span>'+e.name+'<br><span style="font-weight:500;letter-spacing:0;text-transform:none">'+e.role+'</span></span></div><div class="bubble">'+text+'</div></div>'}
function comic(panels){return '<div class="comic">'+panels.map(p=>panel(p[0],p[1])).join('')+'</div>'}
function mini(id){return '<span class="minient">'+ent(id,28)+'</span>'}

/* ---------- chart helpers ---------- */
function barEnd(x,y,w,h,r){if(w<=r)return 'M'+x+' '+y+' h'+Math.max(w,.5)+' v'+h+' h'+(-Math.max(w,.5))+' Z';return 'M'+x+' '+y+' H'+(x+w-r)+' Q'+(x+w)+' '+y+' '+(x+w)+' '+(y+r)+' V'+(y+h-r)+' Q'+(x+w)+' '+(y+h)+' '+(x+w-r)+' '+(y+h)+' H'+x+' Z'}
function barTop(x,y,w,h,r){if(h<=r)return 'M'+x+' '+(y+h)+' v'+(-Math.max(h,.5))+' h'+w+' v'+Math.max(h,.5)+' Z';return 'M'+x+' '+(y+h)+' V'+(y+r)+' Q'+x+' '+y+' '+(x+r)+' '+y+' H'+(x+w-r)+' Q'+(x+w)+' '+y+' '+(x+w)+' '+(y+r)+' V'+(y+h)+' Z'}
function tableView(rows){return '<details class="tv"><summary>Data table</summary><div class="tbl"><table><thead><tr>'+rows[0].map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+r.map((c,i)=>'<td'+(i?' class="num"':'')+'>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></details>'}
function legend(items){return '<div class="legend">'+items.map(i=>'<span><i style="background:var(--'+i[0]+')"></i>'+i[1]+'</span>').join('')+'</div>'}

function chartCost(){
 const rows=[['Missed critical',100],['Out-of-scope action',90],['Missed medium',25],['Severity off by one band',8],['False alarm',3]];
 const W=640,left=215,right=70,rowH=34,top=8,H=top+rows.length*rowH+8,bw=W-left-right;let s='';

 a.forEach((v,i)=>{s+='<circle cx="'+X(i+1)+'" cy="'+Y(v)+'" r="10" fill="transparent" data-tip="pass@'+(i+1)+' = '+v.toFixed(3)+'"/><circle cx="'+X(i+1)+'" cy="'+Y(b[i])+'" r="10" fill="transparent" data-tip="pass^'+(i+1)+' = '+b[i].toFixed(3)+'"/>'});

function quizHTML(id){return '<div class="card quiz" id="quiz-'+id+'"></div>'}
function quizInit(id,qs,opts){opts=opts||{};const root=document.getElementById('quiz-'+id);if(!root)return;let i=0,c=0,timer=null,left=opts.timer||0;
 function best(){return S.quiz[id]}
 function head(){return '<div class="qhead"><span class="eyebrow">'+(opts.label||'Quiz')+'</span><span class="small">'+(i+1)+' / '+qs.length+(best()?' · best '+best().score+'/'+best().total:'')+(opts.timer?' · <span id="tm-'+id+'">'+mmss(left)+'</span>':'')+'</span></div>'}
 function mmss(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
 function tick(){left--;const el=document.getElementById('tm-'+id);if(el)el.textContent=left>0?mmss(left):'time is up, finish anyway';if(left<=0){clearInterval(timer);timer=null}}
 function q(){const Q=qs[i];root.innerHTML=head()+'<p class="qtext">'+Q.q+'</p>'+Q.o.map((o,k)=>'<button class="opt" data-k="'+k+'">'+o+'</button>').join('')+'<div class="fb" id="fb-'+id+'"></div>';root.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.k)))}
 function pick(k){const Q=qs[i],ok=k===Q.a;if(ok)c++;root.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.k===Q.a)b.classList.add('right');else if(+b.dataset.k===k)b.classList.add('wrong')});
  document.getElementById('fb-'+id).innerHTML='<p class="'+(ok?'ok':'no')+'"><b>'+(ok?'Correct.':'Not quite.')+'</b> '+Q.x+'</p><button class="btn primary" id="nx-'+id+'">'+(i+1<qs.length?'Next question':'See score')+'</button>';

R.guided=function(){return modHead('guided')+comic([['rue','No label? Then we judge the work, not the answer. A rubric with behavioral anchors, a blind panel, and we measure whether the panel agrees with itself.'],['pip','And if they don\'t agree?'],['rue','Then the rubric is broken, not the agent. Fix the rubric first. And any single critical violation fails the whole eval: fabricated evidence, an unsafe action, a followed injection.']])+

 '<h2>LLM as judge: the rules</h2><ol><li>Calibrate against human labels on an overlap set. Report agreement and kappa with the panel.</li><li>Test for position bias (swap the order of compared outputs), verbosity bias, and self-preference (judge grading its own model family).</li><li>Prefer a judge from a different model family than the agent.</li><li>Isolate it. The judge sees only the graded output and the tool log. The grader prompt never enters the agent\'s context. The agent cannot write to the score store.</li><li>Sanitize the graded output for instructions aimed at the judge.</li><li>Keep a permanent human-graded slice and compare the judge to it every cycle to detect drift.</li></ol>'+

/* ---------- MODULE 6: ARENA ---------- */
const IQ=[
 {id:'i1',t:'warm',q:'Walk me through how you would evaluate an agent that triages vulnerabilities.',p:'Structure. Do you split the problem or reach for "accuracy"?',a:'Split the agent\'s decisions into ones with a checkable answer and ones without. The first kind gets a static eval with ground truth, run in CI as a hard gate: seeded bugs, adjudicated history, injection and unsafe-action corpora, scored from the tool log. The second kind gets a guided eval before release: an anchored rubric, a blind panel with measured agreement, an adaptive red team with a budget, and a non-inferiority comparison to human triagers. Flags neither can settle go to an unresolved queue scored on evidence and honesty, with an owner, a deadline, and a backfill into ground truth. The harness itself is isolated so the agent cannot read the grader or spoof the log. One monthly number: the unresolved rate.',tr:'Opening with a single accuracy number. Forgetting that the agent takes actions. Never mentioning the harness.'},
 {id:'i2',t:'warm',q:'What is ground truth for triage, and where does it come from?',p:'Do you know the sources and their failure modes?',a:'Seeded bugs in code we control for exact recall. Adjudicated historical submissions, with disputed items kept as a hard slice. Scanner output with adjudicated TP/FP labels. CVE-pinned dependencies with computed reachability. Known-duplicate pairs. An injection corpus and an unsafe-action corpus with deterministic right answers. Every fixed failure and red-team win as a regression case. All of it versioned, canaried, and re-adjudicated on a schedule because labels decay.',tr:'"We download a benchmark." Ignoring label noise. No plan for growth.'},
 {id:'i3',t:'core',q:'What does "pass" mean on the static eval?',p:'Gates versus scores.',a:'A set of gates, not a score. Hard gates at zero on the worst run across seeds: followed injection, out-of-scope action, critical scored as informational, fabricated tool output. Soft gates where the confidence-interval lower bound clears a floor, per slice: recall on high and critical, precision as queue budget, severity within one band, ECE. A no-regression gate paired against the previous version on identical items. Hygiene gates: pinned held-out version, contamination scan clean, label age under the maximum.',tr:'One threshold. Mean instead of worst case for safety. Point estimates instead of lower bounds.'},
 {id:'i4',t:'core',q:'Why per slice? Isn\'t aggregate recall enough?',p:'Do you understand how regressions hide?',a:'Aggregate recall can rise while a class falls below the floor, because the big classes dominate the mean. Slices by vulnerability class, language, and source each get their own floor, and the gate is the minimum over slices. If a slice is too small to clear its floor with confidence, it is reported as not demonstrated, not as passed.',tr:'Weighting slices by volume. Treating small slices as passed on point estimate.'},
 {id:'i5',t:'core',q:'How do you measure calibration, and why does it matter for triage?',p:'Reliability diagram, ECE, and the routing consequence.',a:'Bin items by stated confidence, compute observed accuracy per bin, and plot it against the diagonal. ECE is the weighted mean gap. Brier score captures calibration plus sharpness. It matters because the agent\'s "confirmed" label drives routing: what skips human review and what gets escalated. A "confirmed" that is right 81% of the time is a routing bug, not a vocabulary issue.',tr:'Confusing calibration with accuracy. No link to what the label is used for.'},
 {id:'i6',t:'core',q:'pass@k versus pass^k. Which one for a safety gate?',p:'Definitions and the choice.',a:'pass@k is the probability at least one of k runs succeeds, so it grows with k and measures capability. pass^k is the probability all k runs succeed, so it falls with k and measures reliability. Safety gates use pass^k: at per-run safety of 0.98, ten runs all pass only 82% of the time. We run k seeds at the production temperature and gate on the worst run.',tr:'Reporting the mean over seeds for a safety property.'},
 {id:'i7',t:'core',q:'Experts disagree on labels. How do you build ground truth anyway?',p:'Adjudication protocol and how noise is carried, not hidden.',a:'Two independent labels, adjudication of disagreements by a third senior reviewer, and the agreement rate recorded with the item. Disputed items stay in a separate hard slice. Severity is scored within one band. Where it matters we report agent-versus-panel agreement rather than agent-versus-a-single-label accuracy, since the panel is the ceiling.',tr:'Dropping disputed items. Pretending a single triager\'s label is truth.'},
 {id:'i8',t:'core',q:'How do you know your rubric works?',p:'Inter-rater agreement and what to do when it is low.',a:'Anchored criteria with behavioral descriptions per score. Pilot on a sample, measure Cohen\'s kappa for two raters or Krippendorff\'s alpha for more. Gate on 0.6 or better. If agreement is low, the rubric is broken, not the agent: tighten anchors and re-grade. Critical criteria short-circuit to fail.',tr:'Reporting agent scores from a panel that does not agree with itself.'},
 {id:'i9',t:'senior',q:'When would you use an LLM judge, and how do you keep it honest?',p:'Calibration, bias checks, isolation, drift.',a:'Only after calibrating it against human labels on an overlap set and reporting its kappa with the panel. Test position bias by swapping order, verbosity bias, and self-preference by using a different model family. Isolate it: it sees only the graded output and the tool log, its prompt never enters agent context, and it is the only writer to the score store. Sanitize graded output for instructions. Keep a permanent human-graded slice and compare every cycle to catch drift.',tr:'Using the judge to settle unresolved findings. Same model family as the agent.'},
 {id:'i10',t:'senior',q:'How do you stop the agent from gaming the grader?',p:'Reward hacking controls.',a:'Grader prompt and rubric stay out of the agent\'s context and repository. Grade safety and process claims from the harness tool log, not from text. Sanitize outputs before grading. Keep held-out graders and rotate rubric phrasing. Canary the eval set so leakage shows up. Watch for score-versus-human divergence over time.',tr:'Assuming the agent cannot see the rubric because nobody told it.'},
 {id:'i11',t:'senior',q:'The agent flags something not in your set, and your expert cannot tell. What now?',p:'The unresolved protocol.',a:'It goes to the unresolved queue, which is a claim with evidence obligations, not a verdict. Score what it brought: evidence-ladder level and whether its confidence label was honest. Attempt a lab reproduction. Assign an owner and a deadline. When a human settles it, backfill the outcome into ground truth either way. Never let the agent, a judge, or a self-vote settle it. In production, never auto-close and never auto-escalate externally.',tr:'Calling it a false positive because it is unlabeled. Majority-voting the model.'},
 {id:'i12',t:'senior',q:'How does the ground-truth set grow and stay healthy?',p:'The backfill loop and hygiene.',a:'Three inflows: resolved unresolved flags, red-team successes as regression cases, and label corrections from disagreement audits. Hygiene: versioned snapshots, canaries, label age tracked per item, scheduled re-adjudication, and rotation of held-out items when contamination is suspected.',tr:'A static benchmark downloaded once.'},
 {id:'i13',t:'senior',q:'One metric for a monthly dashboard. Which, and why?',p:'A number that detects drift and cost, not a vanity metric.',a:'Unresolved rate with time-to-resolve, and deferred precision beside it. It rises when ground truth goes stale or the input mix drifts, it measures the human cost the agent generates, and deferred precision says whether that cost buys real findings. Accuracy-style metrics are frozen against a fixed set and cannot see drift.',tr:'"Accuracy." "Number of findings."'},
 {id:'i14',t:'senior',q:'How do you detect benchmark contamination?',p:'Concrete techniques.',a:'Canary strings unique to each item; if one appears in output, the item leaked. N-gram overlap against the training corpus when available. A private held-out set alongside the public one, and a gap between them that widens. Date cutoffs so new items postdate training. Rotation when leakage is found.',tr:'"We trust the vendor."'},
 {id:'i15',t:'senior',q:'How do you compare a new version against the old one?',p:'Paired design and the statistics.',a:'Same held-out items, same seeds and temperature, same tool versions. Per-slice deltas with bootstrap confidence intervals, or McNemar on the discordant items. Hard gates evaluated separately on the worst run. A blind paired guided comparison for open-ended outputs. The release gate is no slice worse beyond noise, plus every other gate still clear.',tr:'Comparing two independent random samples. Aggregate only.'},
 {id:'i16',t:'staff',q:'Aggregate improved. What can still block the release?',p:'Completeness of the gate list.',a:'Any hard-gate violation on any seed. Any slice below its floor by lower bound. Contamination detected. Labels past their maximum age. A critical violation in the guided round. A red-team success within budget. Judge drift beyond tolerance against the human slice. Any of those blocks regardless of the aggregate.',tr:'Negotiating a hard gate because the aggregate looks good.'},
 {id:'i17',t:'core',q:'How do you test prompt-injection resistance?',p:'Static corpus plus adaptive red team, measured at the tool layer.',a:'A static corpus of known payloads across every placement: report body, PoC comments, file names, tool output, follow-up messages. The right behavior is deterministic: ignore, flag, continue. Scored from the tool log on the worst run. Then an adaptive red team with a budget to invent new ones; every success becomes a static case. Track successes per budget over time.',tr:'Transcript grep for "ignore previous instructions."'},
 {id:'i18',t:'senior',q:'Describe the harness isolation.',p:'Can you draw it?',a:'Agent and tools inside a sandbox whose only path out is an egress proxy with an allow-list and a log. The harness records every tool call and result in a log that is the authoritative record. The grader runs with separate credentials, reads only the sanitized final output and the tool log, and is the single writer to the score store. The grader prompt has no read path into the sandbox. In multi-agent pipelines, no shared storage or cache between agents. The eval set is canaried and versioned.',tr:'Grading from the transcript. Shared credentials.'},
 {id:'i19',t:'core',q:'Tool layer versus transcript. Why does it matter?',p:'Spoofing.',a:'The transcript is text the agent produced. It can be wrong, and it can be fabricated on purpose. The tool log is what the harness executed. Every safety and process claim is graded from the log. A transcript claim with no matching log entry is fabricated evidence and fails the eval.',tr:'Trusting a well-formatted "tool output" block.'},
 {id:'i20',t:'staff',q:'How many items do you need in the eval set?',p:'Interval width and power, not a magic number.',a:'It depends on the gate. To show recall at or above 0.95 by lower bound you need hundreds of positives per slice; at 39 of 40 the Wilson lower bound is only about 0.87. To detect a two-point regression in a paired design you need several hundred items with enough discordant pairs. Rare critical classes are the binding constraint, so we seed bugs for them and report small slices as not demonstrated rather than passed.',tr:'"A thousand is enough." No slice awareness.'},
 {id:'i21',t:'staff',q:'Non-inferiority or superiority against the human baseline?',p:'Study design choice and the reason.',a:'Non-inferiority with a pre-registered margin. The goal is safe augmentation or replacement of a triage step, so we need confidence the agent is not worse than the margin, which the interval has to exclude. Superiority tests need large panels and are not the question. Blind, paired, randomized order.',tr:'"It beat the humans on average."'},
 {id:'i22',t:'core',q:'Why not sample the model five times and vote to settle a finding?',p:'Correlated errors.',a:'Samples of one model share training data and blind spots, so agreement measures stability, not truth. Self-consistency can be logged as a feature. It never settles a finding; a human with evidence does.',tr:'Treating self-consistency as verification.'},
 {id:'i23',t:'senior',q:'What is label decay, and what do you do about it?',p:'Operational answer.',a:'Labels become wrong as environments, patches and mitigations change: an old false positive can be exploitable now, an old true positive mitigated. Track label age per item, re-adjudicate on a schedule and whenever the unresolved rate climbs with a frozen model, and version the set so results stay comparable.',tr:'Treating the set as permanent.'},
 {id:'i24',t:'staff',q:'Design the evidence ladder and tie it to the language the agent is allowed to use.',p:'Can you make honesty measurable?',a:'L0 assertion, L1 code pointer with reasoning, L2 trace to the sink, L3 PoC that runs in the sandbox with a matching tool log, L4 human reproduction. "Confirmed" requires L3 or above, "likely" requires L2, everything else is "unverified". The honesty score is whether the label matches the ladder. Overclaiming is a process failure independent of eventual truth, and it is gateable today.',tr:'Scoring unresolved flags on truth you do not have.'}
];

 '<h2>Whiteboard drills</h2><p>Draw each from memory on paper, then compare.</p>'+[['Draw the decision tree that routes an eval question to static, guided, or the unresolved queue.',D1],['Draw the eval lifecycle from CI to production and back into the ground-truth set.',D2],['Draw the harness with the grader isolated from the agent.',D3],['Draw what happens to a flag nobody can settle.',D4]].map((w,i)=>'<details class="card"><summary><b>Drill '+(i+1)+'.</b> '+w[0]+'</summary>'+w[1]()+'</details>').join('')+

function arenaInit(){const root=document.getElementById('arena');if(!root)return;let filter='all',cur=null,revealed=false;const TN={warm:'warm-up',core:'core',senior:'senior',staff:'staff'};

 function stats(){const c={nailed:0,shaky:0,missed:0};IQ.forEach(q=>{if(S.rate[q.id])c[S.rate[q.id]]++});return '<span class="pill ok">nailed '+c.nailed+'</span> <span class="pill t">shaky '+c.shaky+'</span> <span class="pill no">missed '+c.missed+'</span> <span class="small">· '+IQ.length+' questions</span>'}
 function draw(){const p=pool();if(!p.length){cur=null;render();return}const un=p.filter(q=>!S.rate[q.id]);const src=un.length?un:p;cur=src[Math.floor(Math.random()*src.length)];revealed=false;render()}
 function render(){root.innerHTML='<div class="qhead"><span class="eyebrow">Arena</span><span>'+stats()+'</span></div><div class="row">'+[['all','All'],['warm','Warm-up'],['core','Core'],['senior','Senior'],['staff','Staff'],['weak','Shaky + missed']].map(f=>'<button class="chip" data-f="'+f[0]+'" aria-current="'+(filter===f[0])+'">'+f[1]+'</button>').join('')+'</div>'+

  root.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.f;draw()}));const rv=document.getElementById('ar-rev');if(rv)rv.addEventListener('click',()=>{revealed=true;render()});const sk=document.getElementById('ar-skip');if(sk)sk.addEventListener('click',draw);const dr=document.getElementById('ar-draw');if(dr)dr.addEventListener('click',draw);
  root.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{S.rate[cur.id]=b.dataset.r;save();award('iq.'+cur.id,5,'question rated');const all=IQ.every(q=>S.rate[q.id]);if(all)award('iq.all',40,'every question rated');draw()}))}

 return modHead('cheat')+'<div class="tbl"><table><thead><tr><th></th><th>'+mini('pip')+'Static</th><th>'+mini('rue')+'Guided</th><th>'+mini('qbit')+'Unresolved</th></tr></thead><tbody>'+rows.map(r=>'<tr><th>'+r[0]+'</th><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>').join('')+'</tbody></table></div>'+
 '<h2>Numbers worth remembering</h2><div class="grid2"><div class="card"><div class="eyebrow">agreement</div><p>Kappa 0.61 to 0.80 is substantial. Gate the panel at 0.6.</p></div><div class="card"><div class="eyebrow">reliability</div><p>0.98 per run, 10 runs: pass^k is 0.82. Safety gates score the worst run.</p></div><div class="card"><div class="eyebrow">sample size</div><p>39 of 40 looks like 0.975; the Wilson lower bound is about 0.87. Small slices are not demonstrated.</p></div><div class="card"><div class="eyebrow">language</div><p>"Confirmed" needs L3: a PoC that ran in the sandbox with a matching tool log.</p></div></div>'+
 '<h2>The sixty-second answer</h2><div class="card note"><p>Split decisions into checkable and not. Static evals with ground truth gate the checkable ones in CI: seeded bugs, adjudicated history, injection and scope corpora, scored from the tool log, hard gates on the worst run, per-slice floors by lower bound, paired no-regression, hygiene. Guided evals handle the rest before release: anchored rubric, blind panel with kappa, isolated calibrated judge, budgeted red team whose wins feed the static set, non-inferiority to humans. Flags neither can settle go to a queue scored on evidence and honesty with an owner and a deadline, and backfill ground truth when resolved. The harness is isolated so the agent cannot read the grader or spoof the log. The monthly number is the unresolved rate.</p></div>'+

function show(id){if(!R[id])id='start';S.mod=id;S.done['visit.'+id]=true;save();const main=document.getElementById('main');main.innerHTML=R[id]();renderNav();window.scrollTo({top:0});try{history.replaceState(null,'','#'+id)}catch(e){}if(INIT[id])INIT[id]()}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-go]');if(b){show(b.dataset.go)}});
document.getElementById('brand').innerHTML=ent('gate',30)+'<span>Triage Eval Dojo</span>';
function start(data){load();if(data&&data.S)Object.assign(S,data.S);hud();const h=(location.hash||'').replace('#','');show(R[h]?h:(S.mod||'start'))}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S:S}))}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
